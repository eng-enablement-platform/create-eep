name: Publish

# Publishes create-eep to npm via OIDC trusted publishing - no NPM_TOKEN.
# Manual trigger only for now; this moves to release-please once real CI exists.
# npm rejects re-publishing an existing version, so bump package.json first.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token lets the runner mint the short-lived OIDC token npm exchanges
    # for publish auth. The filename (publish.yml) must match the trusted
    # publisher config on npmjs.com exactly.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url is required even with OIDC - without it npm has no
      # registry context to do the exchange and fails with ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24
      # may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package.json "files" only ships dist/ - publishing without building
      # first would release an empty package.
      - name: Build
        run: pnpm build

      - name: Check package
        run: pnpm lint:package

      # Publish with npm, not pnpm - this is the OIDC + provenance path that
      # has been proven end to end.
      - name: Publish
        run: npm publish
