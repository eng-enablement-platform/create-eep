name: Publish

# Releases and publishes create-eep. Two jobs in one workflow:
#   1. release-please - on every push to main, opens/updates the Release PR
#      (version bump + CHANGELOG.md from conventional commits). When that PR is
#      merged, it tags the commit and creates the GitHub Release instead.
#   2. publish - only when a release was just created (or on the manual
#      button): builds and publishes to npm via OIDC trusted publishing.
#
# They must live in one workflow: a Release created with GITHUB_TOKEN does not
# trigger other workflows (GitHub's loop guard), so a separate "on release"
# workflow would never run. Keeping the filename publish.yml also keeps the npm
# trusted publisher config unchanged.
on:
  push:
    branches: [main]
  # Fallback: publish the current version by hand (npm rejects a version that
  # was already published).
  workflow_dispatch:

# Never run two release/publish passes at once; never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Requires Settings -> Actions -> General -> "Allow GitHub Actions to
    # create and approve pull requests".
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Config: release-please-config.json + .release-please-manifest.json.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release-please
    # !cancelled() lets this run on workflow_dispatch, where release-please is
    # skipped; otherwise only right after a release was created.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    # id-token lets the runner mint the short-lived OIDC token npm exchanges
    # for publish auth. The filename (publish.yml) must match the trusted
    # publisher config on npmjs.com exactly.
    # The npm-publish environment only allows the main branch (GitHub
    # Settings -> Environments). Its name is part of the OIDC token, and the
    # npm trusted publisher requires it - so a run from any other branch, or a
    # modified copy of this workflow on a branch, cannot publish.
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # registry-url is required even with OIDC - without it npm has no
      # registry context to do the exchange and fails with ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24
      # may be older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package.json "files" only ships dist/ - publishing without building
      # first would release an empty package.
      - name: Build
        run: pnpm build

      - name: Check package
        run: pnpm lint:package

      # Publish with npm, not pnpm - this is the OIDC + provenance path that
      # has been proven end to end.
      - name: Publish
        run: npm publish
