name: Prepare
description: Install pnpm, Node and dependencies - shared setup for every CI job.

# Each CI job runs on a fresh machine, so every job needs this setup. Keeping it
# in one composite action means one place to change versions, and jobs can't
# drift apart (e.g. one job on a hard-coded Node version).
runs:
  using: composite
  steps:
    # Installs the pnpm version pinned in package.json "packageManager".
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
